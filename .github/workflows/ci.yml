name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/box install.sh lib/*.sh core/*.sh modules/*.sh test/*.sh iso/*.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:24.04", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: install box in a systemd container and check it
        run: test/smoke.sh ${{ matrix.image }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
