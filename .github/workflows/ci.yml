name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/box install.sh lib/*.sh core/*.sh modules/*.sh test/*.sh test/vm/*.sh iso/*.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:24.04", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: install box in a systemd container and check it
        run: test/smoke.sh ${{ matrix.image }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu-26.04", "debian-13"]
    steps:
      - uses: actions/checkout@v4
      - name: let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install box on a real VM and check firewall, ports and reboot
        run: test/vm.sh ${{ matrix.image }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
