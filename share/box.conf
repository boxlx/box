# /etc/box/box.conf — the single source of truth for this box.
#
# Edit it by hand or ask your agent to, then run:  sudo box apply
# Or change one value at a time:                   sudo box config set BOX_AGENTS "claude codex"
#
# Values are plain words in double quotes (no $, backticks or backslashes).
# Lists are space separated. Your edits are versioned by etckeeper (/etc is a
# git repo) and every `box apply` records a restore point first.

# The account you SSH into. Agents run as this user.
BOX_USER="dev"

# Hostname (also your Tailscale machine name). Empty = leave as is.
BOX_HOSTNAME=""

# Timezone, e.g. "Europe/Berlin" or "Asia/Kolkata". Empty = leave as is.
BOX_TIMEZONE=""

# Languages and runtimes, installed per-user with mise (https://mise.jdx.dev).
# Anything `mise use -g` accepts works: "go@latest rust@stable ruby@3 java@21" ...
BOX_LANGS="node@lts bun@latest python@3"

# Coding agents to install. Known: claude codex opencode gemini
BOX_AGENTS="claude codex opencode"

# Opt-in modules. See `box modules` for the list; write your own in /etc/box/modules/.
BOX_MODULES=""

# Docker Engine + compose. "yes" or "no".
BOX_DOCKER="yes"

# ufw firewall: deny inbound except SSH, mosh and your tailnet. "yes" or "no".
BOX_FIREWALL="yes"

# Let BOX_USER sudo without a password (agents need this to install things). "yes" or "no".
BOX_SUDO_NOPASSWD="yes"

# SSH password login: "auto" turns it off once BOX_USER has an SSH key. "yes", "no" or "auto".
BOX_SSH_PASSWORD_AUTH="auto"

# Import SSH public keys from github.com/<user>.keys. Empty = don't.
BOX_SSH_GITHUB_USER=""
